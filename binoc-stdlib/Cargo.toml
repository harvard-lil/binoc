[package]
name = "binoc-stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Standard comparators, transformers, and renderers for Binoc"
publish = false

[features]
default = ["test-vectors"]
# test-vectors: expose run_vector/discover_vectors so plugins can run test vectors without duplicating harness code.
test-vectors = ["insta", "toml", "rayon", "binoc-sdk/test-support"]

[dependencies]
binoc-sdk = { workspace = true }
binoc-core = { workspace = true }
blake3 = "1.8.4"
csv = "1.4.0"
infer = "0.19"
mime_guess = "2.0.5"
serde = { workspace = true }
serde_json = { workspace = true }
similar = "2.7.0"
tempfile = { workspace = true }
walkdir = "2.5.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
tar = "0.4.45"
flate2 = "1"
insta = { version = "1.47.2", features = ["json"], optional = true }
toml = { version = "1.1.2", optional = true }
rayon = { version = "1", optional = true }
