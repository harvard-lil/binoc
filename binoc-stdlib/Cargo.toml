[package]
name = "binoc-stdlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Standard correspondence rule pack and renderers for Binoc"
publish = false

[features]
default = ["test-vectors"]
# test-vectors: expose run_vector/discover_vectors so plugins can run test vectors without duplicating harness code.
test-vectors = ["insta", "rayon", "binoc-sdk/test-support"]

[[bin]]
name = "materialize-test-vectors"
path = "src/bin/materialize_test_vectors.rs"
required-features = ["test-vectors"]

[dependencies]
binoc-sdk = { workspace = true }
binoc-core = { workspace = true }
blake3 = "1.8.5"
csv = "1.4.0"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
fastcdc = "4.0.1"
infer = "0.19"
mime_guess = "2.0.5"
regex = "1.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
similar = "3.1.1"
tempfile = { workspace = true }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1"
insta = { version = "1.46.3", features = ["json"], optional = true }
toml = "1.0.4"
rayon = { version = "1", optional = true }
serde_yaml = "0.9.34"
rust-ini = "0.21"
rust-strings = "0.6.5"
