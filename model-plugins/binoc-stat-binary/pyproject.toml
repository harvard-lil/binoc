[project]
name = "binoc-stat-binary"
version = "0.1.1"
description = "Stata and SAS tabular reader plugin for binoc"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["binoc>=0.1.1"]
authors = [{ name = "Harvard Library Innovation Lab" }]
keywords = ["binoc", "datasets", "sas", "stata", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/harvard-lil/binoc"
Repository = "https://github.com/harvard-lil/binoc"
Issues = "https://github.com/harvard-lil/binoc/issues"
Documentation = "https://github.com/harvard-lil/binoc/tree/main/model-plugins/binoc-stat-binary"

[project.entry-points."binoc.plugins"]
binoc-stat-binary = "binoc_stat_binary"

[project.optional-dependencies]
dev = ["pytest>=8.0", "maturin>=1.7,<2.0", "tomli>=2.0; python_version < '3.11'"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]

[tool.uv.sources]
binoc = { path = "../../binoc-python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
