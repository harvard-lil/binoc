[package]
name = "binoc-excel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "excel correspondence rule pack for Binoc"
publish = false

[lib]
name = "binoc_excel"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# test-support: expose the VectorMaterializer for this format so the plugin's
# own tests and its materialize-test-vectors binary share one builder.
test-support = ["dep:binoc-stdlib", "dep:rust_xlsxwriter"]

[dependencies]
binoc-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
binoc-stdlib = { workspace = true, optional = true, features = ["test-vectors"] }
calamine = { version = "0.35.0", features = ["dates"] }
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
rust_xlsxwriter = { version = "0.96.0", optional = true }

[dev-dependencies]
binoc-core = { workspace = true }
binoc-sdk = { workspace = true, features = ["test-support"] }
binoc-stdlib = { workspace = true, features = ["test-vectors"] }
binoc-excel = { path = ".", features = ["test-support"] }
tempfile = "3"
