[package]
name = "binoc-shapefile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "shapefile (.shp geometry) correspondence rule pack for Binoc"
publish = false

[lib]
name = "binoc_shapefile"
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-support = ["dep:binoc-stdlib", "dep:dbase"]

[dependencies]
binoc-sdk = { workspace = true }
binoc-dbf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = "1.8.5"
binoc-stdlib = { workspace = true, optional = true, features = ["test-vectors"] }
dbase = { version = "0.7.0", optional = true }
shapefile = "0.8.0"

[dev-dependencies]
binoc-core = { workspace = true }
binoc-sdk = { workspace = true, features = ["test-support"] }
binoc-stdlib = { workspace = true, features = ["test-vectors"] }
binoc-shapefile = { path = ".", features = ["test-support"] }
binoc-dbf = { workspace = true, features = ["test-support"] }
dbase = "0.7.0"
tempfile = "3"
