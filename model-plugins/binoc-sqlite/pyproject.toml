[project]
name = "binoc-sqlite"
version = "0.1.0"
description = "SQLite comparator plugin for binoc"
requires-python = ">=3.10"
dependencies = ["binoc"]

[project.entry-points."binoc.plugins"]
binoc-sqlite = "binoc_sqlite"

[project.optional-dependencies]
dev = ["pytest>=8.0", "maturin>=1.7,<2.0", "tomli>=2.0; python_version < '3.11'"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]

[tool.uv.sources]
binoc = { path = "../../binoc-python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
