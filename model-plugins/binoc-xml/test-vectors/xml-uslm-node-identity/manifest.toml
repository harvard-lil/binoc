[vector]
name = "xml-uslm-node-identity"
description = "USLM-shaped XML section nodes keyed by @identifier report section add/remove/in-place edits instead of a generic document value change"
tags = ["xml", "structured-document", "node-identity", "uslm"]

[config.dataset]
paths = [
  { match = "usc.xml", node_identity = { key_attribute = "identifier" } },
]

[expected]
root_action = "modify"
has_tags = [
  "binoc.content-changed",
  "binoc.document-node-addition",
  "binoc.document-node-removal",
  "binoc.document-node-edit",
  "binoc.document-value-change",
]
