[package]
name = "binoc-xml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "XML correspondence rule pack for Binoc"
publish = false

[lib]
name = "binoc_xml"
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-support = ["dep:binoc-stdlib"]

[dependencies]
binoc-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
binoc-stdlib = { workspace = true, optional = true, features = ["test-vectors"] }
quick-xml = "0.39"

[dev-dependencies]
binoc-core = { workspace = true }
binoc-sdk = { workspace = true, features = ["test-support"] }
binoc-stdlib = { workspace = true, features = ["test-vectors"] }
tempfile = "3"
