[package]
name = "binoc-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Plugin SDK and ABI for Binoc dataset-diff plugins"
readme = "README.md"

[features]
default = []
test-support = []
# Enables `schemars::JsonSchema` derives on IR types so the changeset JSON
# schema can be generated by the `gen-changeset-schema` binary. Opt-in so
# downstream users of binoc-sdk don't pay for a dependency they don't need;
# see docs/adr/documentation_platform_and_info_design.md Open Question 1.
schema = ["dep:schemars"]

[dependencies]
blake3 = "1.8.3"
rand = "0.10.1"
schemars = { version = "1.2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = "2.0"

[[bin]]
name = "gen-changeset-schema"
path = "src/bin/gen_changeset_schema.rs"
required-features = ["schema"]
