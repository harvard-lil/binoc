[vector]
name = "json-keyed-row-diff"
description = "Configured JSON record keys match reordered rows and report keyed row/cell changes"
tags = ["json", "keyed", "row-addition", "row-removal", "cell-change"]

[[config.dataset.paths]]
match = "data.json"
row_identity = { columns = ["id"] }

[expected]
root_action = "modify"
has_tags = ["binoc.row-addition", "binoc.row-removal", "binoc.cell-change"]
