[vector]
name = "file-correspondence-container"
description = "Config declares a correspondence between renamed zip containers"
tags = ["zip", "file-correspondence", "declared-correspondence", "container"]

[config.dataset.files]
[[config.dataset.files.correspondences]]
name = "archive-pair"
key = "archive"

[config.dataset.files.correspondences.left]
path_regex = "^data\\.zip$"

[config.dataset.files.correspondences.right]
path_regex = "^archive\\.zip$"
