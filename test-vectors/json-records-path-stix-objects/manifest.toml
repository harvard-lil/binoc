[vector]
name = "json-records-path-stix-objects"
description = "STIX-shaped JSON bundle records under $.objects are parsed as a keyed table"
tags = ["json", "records", "records-path", "stix", "keyed"]

[[config.dataset.paths]]
match = "**/*.stix.json"
records_path = "$.objects"
row_identity = { columns = ["id"] }

[expected]
root_action = "modify"
has_tags = ["binoc.cell-change"]
