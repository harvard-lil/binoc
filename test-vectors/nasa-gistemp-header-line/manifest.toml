[vector]
name = "nasa-gistemp-header-line"
description = "NASA GISTEMP-style table with a title line before the real header"
tags = ["csv", "config", "shape", "header-line", "keyed"]

[[config.dataset.paths]]
match = "**/GLB.Ts+dSST.csv"
content_type = "text/csv"
shape = { header_line = 2 }
row_identity = { columns = ["Year"] }

[expected]
root_action = "modify"
has_tags = ["binoc.cell-change"]
